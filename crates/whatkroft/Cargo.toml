[package]
name = "whatkroft"
description = "WhatKroft: a native GTK4 WhatsApp client for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
whatkroft-ipc.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
async-channel = "2"
qrcode = { version = "0.14", default-features = false }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
