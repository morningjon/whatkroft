[workspace]
resolver = "3"
members = ["crates/whatkroft-ipc", "crates/whatkroftd", "crates/whatkroft"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-or-later"
repository = "https://github.com/morningjon/whatkroft"

[workspace.dependencies]
whatkroft-ipc = { path = "crates/whatkroft-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
strip = true
